[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lease-extraction-pipeline"
version = "1.1.0"
description = "Free-tier Gemini API, retrieval-grounded, schema-constrained PDF lease extraction"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "jsonschema>=4.20,<5",
  ]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
lease-extract = "lease_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
